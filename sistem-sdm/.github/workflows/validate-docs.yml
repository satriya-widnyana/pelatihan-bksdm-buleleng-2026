name: Validate Documentation & Code Quality

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      # Memvalidasi Anotasi OpenAPI / Swagger
      - name: Generate Swagger Docs (Fail if syntax is invalid)
        run: php artisan l5-swagger:generate --ansi

      # Memvalidasi PHPDoc dan Tipe Data
      - name: Run PHPStan (Static Analysis & PHPDoc Validation)
        # Akan gagal jika ada tipe data di PHPDoc yang tidak sinkron dengan logika kode
        run: ./vendor/bin/phpstan analyse --level=5 app/
